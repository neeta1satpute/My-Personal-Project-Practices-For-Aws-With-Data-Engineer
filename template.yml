AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  s3-copy-automation

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  ProjectName:
    Type: String
    Default: s3-copy-automation

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:

  # ============================================
  # Source Bucket
  # ============================================
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-source-${Environment}
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # ============================================
  # Destination Bucket
  # ============================================
  DestinationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-destination-${Environment}

  # ============================================
  # Lambda Role
  # ============================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt SourceBucket.Arn
                  - !Sub ${SourceBucket.Arn}/*

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !GetAtt DestinationBucket.Arn
                  - !Sub ${DestinationBucket.Arn}/*

  # ============================================
  # Lambda Function
  # ============================================
  S3CopyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-copy-${Environment}
      CodeUri: lambda/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 300
      Role: !GetAtt LambdaExecutionRole.Arn

      Environment:
        Variables:
          DESTINATION_BUCKET: !Ref DestinationBucket

  # ============================================
  # EventBridge Rule
  # ============================================
  S3ObjectCreatedRule:
    Type: AWS::Events::Rule
    DependsOn: S3CopyFunction
    Properties:
      Name: !Sub ${ProjectName}-s3-copy-rule-${Environment}
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref SourceBucket

      Targets:
        - Id: LambdaTarget
          Arn: !GetAtt S3CopyFunction.Arn

  # ============================================
  # Lambda Permission
  # ============================================
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3CopyFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3ObjectCreatedRule.Arn

Outputs:

  SourceBucket:
    Value: !Ref SourceBucket

  DestinationBucket:
    Value: !Ref DestinationBucket

  LambdaFunction:
    Value: !Ref S3CopyFunction