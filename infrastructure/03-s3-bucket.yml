
AWSTemplateFormatVersion: "2010-09-09"

Description: Create S3 Bucket using GitHub Actions

Resources:
  PracticeS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: neeta-github-actions-practice-956298403883

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      Tags:
        - Key: Project
          Value: GitHubActionsPractice

Outputs:
  S3BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref PracticeS3Bucket

  S3BucketArn:
    Description: ARN of the created S3 bucket
    Value: !GetAtt PracticeS3Bucket.Arn
